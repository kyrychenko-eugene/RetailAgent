[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retail_agent"
version = "0.1.0"
description = "Retail analytics agent prototype (BigQuery thelook_ecommerce)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not bq and not llm'"
markers = [
    "bq: needs GCP credentials and GOOGLE_CLOUD_PROJECT (BigQuery integration)",
    "llm: needs GOOGLE_API_KEY (live LLM, counts against the free-tier quota)",
]
